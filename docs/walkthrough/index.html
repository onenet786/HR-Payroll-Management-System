<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Bin Ishaq HR Suite — Guided Walkthrough</title>
  <style>
    :root{--ink:#10241e;--muted:#60716b;--paper:#f4f1e8;--panel:#fffdf7;--green:#147a56;--lime:#cce36a;--line:#d9ddd5;--blue:#275d78;--red:#9d443f;--shadow:0 18px 60px rgba(16,36,30,.12)}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif;min-height:100vh}.shell{display:grid;grid-template-columns:290px 1fr;min-height:100vh}.rail{background:var(--ink);color:#fff;padding:30px 24px;position:sticky;top:0;height:100vh;overflow:auto}.brand{display:flex;gap:12px;align-items:center;margin-bottom:28px}.mark{width:43px;height:43px;border:1px solid #7d9a8f;display:grid;place-items:center;font-weight:900;color:var(--lime);font-size:18px}.brand h1{font-size:15px;margin:0;line-height:1.25}.brand p{font-size:10px;color:#aebfb8;margin:4px 0 0;letter-spacing:.12em;text-transform:uppercase}.progress{height:4px;background:#365048;margin:0 0 22px}.progress span{display:block;height:100%;background:var(--lime);width:12.5%;transition:.35s}.steps{display:grid;gap:5px}.step{width:100%;border:0;background:transparent;color:#9db0a9;text-align:left;padding:10px 11px;border-left:2px solid #38534a;cursor:pointer;font-size:12px}.step strong{display:block;color:#d7e1dd;font-size:11px;margin-bottom:3px}.step.active{background:#1b332b;color:#fff;border-left-color:var(--lime)}.rail-note{margin-top:24px;border-top:1px solid #365048;padding-top:18px;font-size:11px;line-height:1.55;color:#9db0a9}.main{padding:32px;min-width:0}.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.16em;color:var(--green);font-weight:800}.counter{font:700 12px monospace;color:var(--muted)}.stage{background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);min-height:610px;display:grid;grid-template-rows:auto 1fr auto}.stage-head{padding:26px 30px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:20px}.stage h2{font-size:30px;letter-spacing:-.04em;margin:0 0 7px}.stage-head p{margin:0;color:var(--muted);font-size:13px;line-height:1.5}.why{max-width:315px;background:#eef3df;border-left:4px solid var(--lime);padding:12px 14px;font-size:11px;line-height:1.5}.canvas{padding:28px 30px;overflow:auto}.screen{border:1px solid #cdd4ce;background:#f8faf8;min-height:370px;box-shadow:0 8px 30px rgba(16,36,30,.07)}.appbar{height:48px;background:#152b24;color:#fff;display:flex;align-items:center;padding:0 18px;justify-content:space-between;font-size:12px}.appbar b{color:var(--lime)}.screen-body{padding:24px}.login-grid{display:grid;grid-template-columns:1.15fr .85fr;min-height:322px}.intro{background:#e7eee9;padding:42px}.intro h3{font-size:27px;margin:0 0 12px}.intro p{font-size:13px;color:var(--muted);line-height:1.65}.form{padding:38px;background:#fff}.label{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:800;margin:13px 0 6px}.input,.select{width:100%;border:1px solid #bcc8c1;padding:11px;background:#fff;color:var(--ink)}.btn{border:0;background:var(--green);color:#fff;padding:11px 16px;font-weight:800;cursor:pointer;margin-top:15px}.btn.secondary{background:#e8ece8;color:var(--ink);border:1px solid #cad2cc;margin-left:7px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.card{background:#fff;border:1px solid #dbe1dc;padding:16px}.card .num{font-size:24px;font-weight:900;margin:8px 0 3px}.card small{color:var(--muted)}.table{width:100%;border-collapse:collapse;background:#fff;font-size:11px}.table th{background:#e9efeb;text-align:left;padding:10px;color:#52645e;text-transform:uppercase;font-size:9px;letter-spacing:.08em}.table td{padding:11px 10px;border-top:1px solid #e3e7e4}.pill{display:inline-block;padding:3px 7px;background:#dcefe6;color:#126144;font-weight:700;font-size:9px}.pill.warn{background:#f6e8c7;color:#805b18}.flow{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;padding:45px 10px}.node{background:#fff;border:1px solid #bbc8c0;padding:17px 13px;text-align:center;min-width:118px;font-size:11px}.arrow{font-size:20px;color:var(--green)}.decision{margin-top:16px;padding:13px;border:1px dashed #9bad9f;background:#f4f7f4;font-size:12px}.stage-foot{border-top:1px solid var(--line);padding:17px 30px;display:flex;justify-content:space-between;align-items:center}.hint{font-size:11px;color:var(--muted)}.nav{display:flex;gap:8px}.nav button{border:1px solid #b7c3bc;background:#fff;padding:9px 14px;cursor:pointer;font-weight:700}.nav button.primary{background:var(--ink);color:#fff;border-color:var(--ink)}.nav button:disabled{opacity:.35;cursor:not-allowed}.spot{outline:3px solid var(--lime);outline-offset:2px}.toast{position:fixed;right:28px;bottom:24px;background:var(--ink);color:#fff;padding:12px 16px;font-size:12px;box-shadow:var(--shadow);display:none}.toast.show{display:block}.mobile{max-width:290px;margin:8px auto;border:8px solid #1a2924;border-radius:30px;background:#101c18;color:#fff;min-height:350px;padding:20px 14px}.mobile h3{margin:5px 0}.mobile-card{background:#20342d;padding:13px;margin:12px 0;font-size:11px}.mobile-nav{display:flex;justify-content:space-around;color:#a7bbb3;font-size:9px;margin-top:25px}.callout{padding:12px;background:#edf2ea;border-left:3px solid var(--green);font-size:11px;line-height:1.5;margin-top:14px}
    @media(max-width:900px){.shell{grid-template-columns:1fr}.rail{position:relative;height:auto;padding:18px}.steps{grid-template-columns:repeat(4,1fr)}.step{padding:8px;font-size:0}.step strong{font-size:10px}.rail-note{display:none}.main{padding:18px}.stage-head{display:block}.why{margin-top:12px;max-width:none}.grid{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:560px){.steps{grid-template-columns:repeat(2,1fr)}.main{padding:10px}.stage-head,.canvas,.stage-foot{padding:17px}.stage h2{font-size:23px}.login-grid{grid-template-columns:1fr}.intro{padding:22px}.form{padding:22px}.grid{grid-template-columns:1fr}.stage-foot{align-items:flex-start;gap:12px;flex-direction:column}.topbar{margin-top:5px}}
  </style>
</head>
<body>
<div class="shell">
  <aside class="rail">
    <div class="brand"><div class="mark">BI</div><div><h1>HR & Payroll<br>Management System</h1><p>Guided product tour</p></div></div>
    <div class="progress"><span id="progress"></span></div>
    <nav class="steps" id="steps"></nav>
    <div class="rail-note">Pakistan Payroll Edition<br>FBR · EOBI · Provincial Social Security · PF · Gratuity</div>
  </aside>
  <main class="main">
    <div class="topbar"><span class="eyebrow">Interactive operations walkthrough</span><span class="counter" id="counter"></span></div>
    <section class="stage">
      <header class="stage-head"><div><h2 id="title"></h2><p id="subtitle"></p></div><div class="why"><strong>WHY THIS SCREEN EXISTS</strong><br><span id="why"></span></div></header>
      <div class="canvas" id="canvas"></div>
      <footer class="stage-foot"><span class="hint" id="decision"></span><div class="nav"><button id="back">← Back</button><button id="action" class="primary">Try action</button><button id="next" class="primary">Next →</button></div></footer>
    </section>
  </main>
</div>
<div class="toast" id="toast"></div>
<script>
const scenes=[
{name:'Access',title:'Role-aware sign in',subtitle:'Start with an authorized identity; the role controls what appears next.',why:'Personal, payroll and biometric records require separation of duties.',decision:'Decision: Which role and work context should this session use?',html:`<div class="screen login-grid"><div class="intro"><div class="eyebrow">Pakistan HR operations</div><h3>Connected evidence.<br>Controlled payroll.</h3><p>Employee setup, attendance, leave and statutory rules become a reviewable payroll result—across web, mobile, Windows and kiosk.</p><div class="callout">This walkthrough uses simulated information only.</div></div><div class="form"><div class="label">Username or email</div><input id="demoUser" class="input" value="admin"><div class="label">Password</div><input class="input" type="password" value="demonstration"><button class="btn spot" data-demo="Signed in as Super Admin">Sign in</button></div></div>`},
{name:'Dashboard',title:'Operational dashboard',subtitle:'A compact view of workforce activity before transactional work begins.',why:'Managers need one place to recognize exceptions instead of opening every register.',decision:'Decision: Which operational exception needs attention first?',html:`<div class="screen"><div class="appbar"><span><b>BI</b> HR Suite</span><span>Server synced · Super Admin</span></div><div class="screen-body"><div class="grid"><div class="card"><small>ACTIVE EMPLOYEES</small><div class="num">126</div><span class="pill">+4 this month</span></div><div class="card"><small>PRESENT TODAY</small><div class="num">112</div><span class="pill">88.9%</span></div><div class="card spot"><small>PENDING LEAVE</small><div class="num">7</div><span class="pill warn">Review required</span></div><div class="card"><small>PAYROLL STATUS</small><div class="num">Draft</div><span class="pill">July 2026</span></div></div><div class="decision">Suggested action: review pending leave before final payroll validation.</div></div></div>`},
{name:'People',title:'Employee master record',subtitle:'The shared identity, organization, compensation, bank and statutory source.',why:'All downstream records need one stable employee ID and effective HR profile.',decision:'Decision: Are branch, wage type, statutory enrollment and bank details correct?',html:`<div class="screen"><div class="appbar"><span>Employees / Directory</span><button class="btn" data-demo="Add employee form opened">+ Add employee</button></div><div class="screen-body"><table class="table"><thead><tr><th>Employee</th><th>Branch</th><th>Department</th><th>Wage</th><th>Status</th></tr></thead><tbody><tr class="spot"><td><b>Ali Raza Khan</b><br>BINISHAQ-IT-00001</td><td>Karachi HQ</td><td>Information Technology</td><td>Salaried</td><td><span class="pill">Active</span></td></tr><tr><td><b>Sara Ahmed</b><br>BINISHAQ-HR-00001</td><td>Karachi HQ</td><td>Human Resources</td><td>Salaried</td><td><span class="pill">Active</span></td></tr><tr><td><b>Kamran Bashir</b><br>BINISHAQ-WLOG-00003</td><td>Lahore Hub</td><td>Warehouse</td><td>Daily Wager</td><td><span class="pill">Active</span></td></tr></tbody></table><div class="callout">Connected to attendance, leave, payroll, loans, reviews, assets and gratuity.</div></div></div>`},
{name:'Time & Leave',title:'Attendance and leave evidence',subtitle:'Validate worked time, regularization and approved absence before payroll.',why:'Payroll cannot distinguish payable leave from unauthorized absence without these records.',decision:'Decision: Approve, reject or correct the exception before it reaches payroll?',html:`<div class="screen"><div class="appbar"><span>Attendance / July 2026</span><span>Daily · Weekly · Monthly · Annual</span></div><div class="screen-body"><table class="table"><thead><tr><th>Employee</th><th>Punch in</th><th>Punch out</th><th>Method</th><th>Status</th><th>OT</th></tr></thead><tbody><tr><td>Ali Raza</td><td>08:57</td><td>18:03</td><td>Biometric</td><td><span class="pill">Present</span></td><td>3 min</td></tr><tr class="spot"><td>Sara Ahmed</td><td>—</td><td>—</td><td>Approved leave</td><td><span class="pill warn">On Leave</span></td><td>0</td></tr><tr><td>Kamran Bashir</td><td>09:18</td><td>19:02</td><td>Mobile GPS</td><td><span class="pill warn">Late</span></td><td>44 min</td></tr></tbody></table><button class="btn" data-demo="Regularization approved and audit information recorded">Approve regularization</button></div></div>`},
{name:'Payroll',title:'Pakistan payroll preview',subtitle:'Combine current evidence with effective FBR, EOBI, social-security and PF rules.',why:'A preview exposes anomalies before financial balances and payment files are committed.',decision:'Decision: Is this period complete and ready to become a frozen Draft?',html:`<div class="screen"><div class="appbar"><span>Payroll / July 2026</span><span>Tax Year 2027</span></div><div class="screen-body"><table class="table"><thead><tr><th>Staff</th><th>Gross PKR</th><th>FBR</th><th>EOBI</th><th>Social Sec.</th><th>PF</th><th>Net PKR</th></tr></thead><tbody><tr><td>Ali Raza</td><td>184,327</td><td>10,167</td><td>370</td><td>2,400</td><td>9,000</td><td><b>164,790</b></td></tr><tr><td>Sara Ahmed</td><td>230,000</td><td>17,133</td><td>370</td><td>2,400</td><td>19,159</td><td><b>193,338</b></td></tr><tr><td>Kamran Bashir</td><td>44,120</td><td>0</td><td>370</td><td>2,400</td><td>0</td><td><b>43,750</b></td></tr></tbody></table><button class="btn spot" data-demo="Draft payroll created; employee snapshots frozen">Run New Payroll Cycle</button></div></div>`},
{name:'Control',title:'Approval and disbursement gates',subtitle:'Move payroll in order: Draft → Approved → Disbursed.',why:'Controlled states prevent duplicate processing, premature loan posting and rewritten history.',decision:'Decision: Has an authorized reviewer validated the run and payment authorization?',html:`<div class="screen"><div class="appbar"><span>Historical Runs</span><span>Audit trail enabled</span></div><div class="screen-body"><div class="flow"><div class="node spot"><b>DRAFT</b><br><small>Snapshots saved</small></div><span class="arrow">→</span><div class="node"><b>APPROVED</b><br><small>Loans posted once</small></div><span class="arrow">→</span><div class="node"><b>DISBURSED</b><br><small>Payment recorded</small></div></div><button class="btn" data-demo="Run approved by the current authorized user">Approve payroll</button><button class="btn secondary" data-demo="Run marked as disbursed">Mark disbursed</button><div class="callout">Every transition records who acted and when.</div></div></div>`},
{name:'Employee',title:'Mobile self-service',subtitle:'Attendance, leave and approved payslips in the employee’s own context.',why:'Self-service reduces routine HR queries while keeping private results scoped to the employee.',decision:'Decision: Punch attendance, request leave, regularize or inspect the latest approved payslip?',html:`<div class="screen"><div class="mobile"><small>09:04 · Secure session</small><h3>Hello, Ali</h3><p style="color:#9db0a9;font-size:11px">Sunday, 5 July 2026</p><div class="mobile-card spot"><b>Today’s attendance</b><br><br>Not punched yet<br><button class="btn" data-demo="Camera/GPS attendance flow started">Open camera punch</button></div><div class="mobile-card"><b>Latest approved payslip</b><br>June 2026 · PKR 164,790</div><div class="mobile-nav"><span>HOME</span><span>ATTEND</span><span>LEAVE</span><span>PAYSLIP</span></div></div></div>`},
{name:'Governance',title:'Configuration and governance',subtitle:'Keep statutory values, permissions, devices and maintenance under administrative control.',why:'An HRMS stays reliable only when rates, access, devices and recovery processes are maintained.',decision:'Decision: Which verified rule, permission or operational control needs an authorized update?',html:`<div class="screen"><div class="appbar"><span>System Governance</span><span>Pakistan only</span></div><div class="screen-body"><div class="grid"><div class="card spot"><small>STATUTORY</small><div class="num">TY 2027</div><p>FBR slabs, EOBI basis, province rates</p></div><div class="card"><small>ACCESS</small><div class="num">5 roles</div><p>Least-privilege permissions</p></div><div class="card"><small>BIOMETRIC</small><div class="num">URU</div><p>Enrollment and bridge health</p></div><div class="card"><small>RECOVERY</small><div class="num">4 tools</div><p>Backup, cleanup, delete, restore</p></div></div><div class="callout">Operational finish line: verify statutory evidence, secure Firebase access, test bank layout, and keep recoverable backups.</div></div></div>`}
];
let current=0;const $=s=>document.querySelector(s);const steps=$('#steps');
scenes.forEach((s,i)=>{const b=document.createElement('button');b.className='step';b.innerHTML=`<strong>${String(i+1).padStart(2,'0')} · ${s.name}</strong>${s.title}`;b.onclick=()=>show(i);steps.appendChild(b)});
function bindDemo(){document.querySelectorAll('[data-demo]').forEach(el=>el.addEventListener('click',()=>toast(el.dataset.demo)))}
function show(i){current=Math.max(0,Math.min(scenes.length-1,i));const s=scenes[current];$('#title').textContent=s.title;$('#subtitle').textContent=s.subtitle;$('#why').textContent=s.why;$('#decision').textContent=s.decision;$('#canvas').innerHTML=s.html;$('#counter').textContent=`${current+1} / ${scenes.length}`;$('#progress').style.width=`${(current+1)/scenes.length*100}%`;document.querySelectorAll('.step').forEach((e,n)=>e.classList.toggle('active',n===current));$('#back').disabled=current===0;$('#next').disabled=current===scenes.length-1;bindDemo()}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2300)}
$('#back').onclick=()=>show(current-1);$('#next').onclick=()=>show(current+1);$('#action').onclick=()=>{const target=document.querySelector('[data-demo]');if(target)target.click();else toast('Review the highlighted decision area')};document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')show(current+1);if(e.key==='ArrowLeft')show(current-1)});show(0);
</script>
</body>
</html>
