name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Electron is only needed for desktop/kiosk packaging, not for tests or the web build.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: hr_payroll_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci -d hr_payroll_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Server and kiosk tests
        run: node --test server/*.test.cjs windows-kiosk/*.test.cjs

      - name: Apply database migrations
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/hr_payroll_test
        run: npm run postgres:migrate

      - name: Database integration tests
        env:
          TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/hr_payroll_test
        run: npm run test:integration

      - name: Production build
        env:
          # Never bake a production API URL into CI builds.
          VITE_API_BASE_URL: ''
        run: npm run build
